# Build dell'APK Android di Esoteric Circle.
#
# In questo ambiente Flutter e Dart non compilano: la build della Demo si fa
# qui. Il workflow monta Flutter, inietta la configurazione Firebase da un
# secret (mai su Git), compila un APK di debug e lo pubblica come artifact da
# scaricare e installare sul telefono.
#
# Prerequisito: creare nel repository il secret GOOGLE_SERVICES_JSON con il
# contenuto di google-services.json codificato in base64.
# Dettagli in docs/C3_CHAT_MEDORA_SETUP.md.
name: Android build (APK debug)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/esoteric-circle-master-order-e798aj

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Inietta google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Manca il secret GOOGLE_SERVICES_JSON. Vedi docs/C3_CHAT_MEDORA_SETUP.md." >&2
            exit 1
          fi
          # Tollerante: prova a decodificare da base64, altrimenti usa il testo
          # cosi' com'e' (JSON grezzo). Cosi' va bene sia se incolli il base64
          # sia se incolli direttamente il contenuto del file.
          if echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json 2>/dev/null \
             && head -c1 android/app/google-services.json | grep -q '{'; then
            echo "google-services.json scritto da base64."
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json scritto da JSON grezzo."
          fi

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze
        continue-on-error: true

      - name: Build APK di debug
        run: flutter build apk --debug

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: esoteric-circle-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
