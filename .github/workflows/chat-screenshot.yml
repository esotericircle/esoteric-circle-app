# Screenshot della chat di Medora, visibile con un solo tocco.
#
# Genera uno screenshot reale della chat con un widget test headless (font veri,
# provider AI offline, nessuna rete, nessun emulatore) e lo committa nel repo a
# un percorso fisso, docs/preview/medora-chat.png, sovrascrivendolo ogni volta.
# Cosi' Mauro lo apre direttamente su GitHub dal telefono, senza scaricare zip
# ne' navigare in Actions. Niente secret, niente Android build: la prova della
# risposta reale di Vertex resta l'APK sul telefono.
name: Chat screenshot (Medora)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/esoteric-circle-master-order-e798aj
    # Il commit dello screenshot tocca solo docs/preview: lo ignoriamo qui, cosi'
    # non si riavvia il workflow. Doppia sicurezza con [skip ci] nel messaggio.
    paths-ignore:
      - "docs/preview/**"

# Serve per committare lo screenshot con il GITHUB_TOKEN del workflow.
permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Dipendenze
        run: flutter pub get

      # AGGIORNA_ANTEPRIME e' la richiesta esplicita di scrivere in docs/preview.
      # Senza, le catture finiscono in build/preview e l'albero resta pulito, che
      # e' quel che si vuole in locale e nella CI di controllo. Qui invece le
      # anteprime vanno proprio aggiornate, quindi si valorizza.
      - name: Genera gli screenshot (widget test headless)
        env:
          AGGIORNA_ANTEPRIME: "1"
        run: flutter test test/screenshot_capture_test.dart

      - name: Committa gli screenshot a percorso fisso
        if: success()
        run: |
          if [ ! -f docs/preview/medora-chat.png ]; then
            echo "Nessuno screenshot generato, niente da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/
          if git diff --cached --quiet; then
            echo "Screenshot invariati, nessun commit."
            exit 0
          fi
          git commit -m "docs: aggiorna anteprime chat Medora [skip ci]"
          git push origin HEAD:claude/esoteric-circle-master-order-e798aj

      - name: Pubblica gli screenshot anche come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medora-chat-screenshot
          path: docs/preview/
          if-no-files-found: warn
