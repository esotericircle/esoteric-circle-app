# Screenshot della chat di Medora, per validare la UI a ogni push.
#
# Gira un test di integrazione su un emulatore Android e cattura la schermata
# della chat. Usa un provider AI offline (nessuna rete, nessuna chiave), quindi
# non serve il secret Firebase: la configurazione qui e' un google-services.json
# segnaposto, generato al volo solo per far compilare l'app. La prova della
# risposta reale di Vertex resta l'APK sul telefono.
name: Chat screenshot (Medora)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/esoteric-circle-master-order-e798aj

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: google-services.json segnaposto (solo per compilare, offline)
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "esoteric-circle-placeholder",
              "storage_bucket": "esoteric-circle-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.esotericircle.esoteric_circle"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyPLACEHOLDER00000000000000000000000000" }
                ],
                "services": {
                  "appinvite_service": { "other_platform_oauth_client": [] }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "google-services.json segnaposto scritto."

      - name: Dipendenze
        run: flutter pub get

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e cattura screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/chat_screenshot_test.dart

      - name: Pubblica lo screenshot come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medora-chat-screenshot
          path: screenshots/
          if-no-files-found: warn
