# Il verde di base, certificato dal repository.
#
# A ogni spinta sul branch di lavoro esegue **LO SBARRAMENTO**,
# `bash tool/sbarramento.sh`: lo stesso cancello del PC, e quello di cui la
# build iOS su Codemagic legge il verdetto prima di partire (ordine
# CODEMAGIC2). Nessuna build, nessun deploy, nessun secret. Serve a
# rispondere a una sola domanda, leggibile anche dal telefono guardando la
# spunta verde su GitHub: questo commit passerebbe il cancello della build?
#
# **PERCHE' NON PIU' `flutter test`. Ordine CODEMAGIC1 voce 02, 16 settembre
# 2026.** La build 2264 e' caduta sul mac mini al passo dodici dopo ventinove
# minuti, e il rosso che l'ha fermata era una riga sola: un'anteprima che
# catturava a rapporto due invece di tre. **Quel rosso `flutter test` lo
# vedeva**, ed era passato lo stesso, perche' il file era nato dopo l'ultimo
# giro del cancello locale e nessuno l'aveva rigirato.
#
# Ma il punto non e' quel rosso: e' che **le due domande erano diverse**. Qui
# girava `flutter test`, che non fa le prove del server, non fa il corredo a
# scala 1,3 e non guarda il registro dei rossi accettati; su Codemagic girava
# lo sbarramento, che fa tutte e tre le cose. Un cancello a valle piu' severo
# di quello a monte e' un cancello che scopre i guasti dove si paga.
#
# **Adesso la domanda e' la stessa.** Un rifiuto da Codemagic per una prova
# rossa ha bisogno che prima sia rossa qui, dove non costa niente.
#
# **LO SBARRAMENTO DIVISO SU PIU' MACCHINE. Ordine ACCELERA, 26 settembre
# 2026.** Il fondatore: *"Ma non c'e' modo di accelerare Suite, sbarramenti,
# ecc?"* e *"Ma se l'accelerazione e' sempre disponibile, usala sempre"*. Su
# una macchina sola questo cancello durava circa 33 minuti. Adesso:
#   - sei macchine fanno ciascuna un pezzo della suite, diviso per FILE da
#     `tool/i_pezzi_della_suite.py` (ogni file intero su una macchina sola:
#     compila solo i suoi, e le prove di un file restano insieme);
#   - una macchina fa il corredo a scala 1,3, una il server e le chiusure, una
#     l'analisi statica;
#   - l'ultima, "analyze e sbarramento", aspetta tutte le altre, riunisce i
#     loro registri e decide con lo sbarramento di sempre, cancelli e rossi
#     accettati compresi. **Un pezzo che manca ferma il cancello.**
# Le macchine dei pezzi non falliscono sui rossi: conservano registro ed
# esito, e decide solo l'ultima. Se fallissero loro, un rosso accettato
# renderebbe rosso tutto il giro, e Codemagic leggerebbe "rosso".
#
# **Cosa questo cancello NON puo' dire**, e va detto: firma, profili, pod,
# spazio sul disco, versione di Xcode, validazione dell'archivio da parte di
# Apple. Nessuna macchina Linux gratuita costruisce un archivio iOS firmato.
# Questa strada toglie la famiglia di cadute piu' frequente, non tutte.
#
# La build dell'APK resta in android-build.yml. Le anteprime NON le fa nessuna
# azione: l'azione che le rigenerava e le salvava da sola sul ramo canonico e'
# stata disattivata e tolta dal repository il 12 agosto 2026, dopo due conflitti.
# Si rigenerano da chi lavora, con AGGIORNA_ANTEPRIME=1, e finiscono nello stesso
# commit del codice. Qui non si tocca l'albero: i test di cattura scrivono in
# build/preview, che non e' versionata.
name: Verde di base (analyze e sbarramento)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/esoteric-circle-master-order-e798aj
  pull_request:
    branches:
      - claude/esoteric-circle-master-order-e798aj

jobs:
  analisi:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # LA VERSIONE E' FISSATA, ordine BF voce 05.i: "channel: stable"
          # nudo scarica la stable del giorno, e un aggiornamento a monte
          # cambierebbe la CI sotto i piedi senza nessun commit. Il numero
          # coincide con codemagic.yaml e docs/versione_flutter.json.
          flutter-version: 3.44.5
          cache: true

      - name: Dipendenze Flutter
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

  pezzo:
    name: suite, pezzo ${{ matrix.pezzo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Un pezzo rosso non ferma gli altri: il verdetto e' dell'ultima macchina.
      fail-fast: false
      matrix:
        pezzo: [0, 1, 2, 3, 4, 5]
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Dipendenze Flutter
        run: flutter pub get

      # I file di questo pezzo li sceglie tool/i_pezzi_della_suite.py: sei
      # pezzi di peso simile, ogni file intero in un pezzo solo. **L'elenco si
      # calcola prima e non puo' essere vuoto**: con un elenco vuoto
      # `flutter test` farebbe girare tutta la suite, in silenzio.
      - name: Il pezzo della suite
        run: |
          set -e
          FILE_DEL_PEZZO="$(python3 tool/i_pezzi_della_suite.py 6 ${{ matrix.pezzo }})"
          test -n "$FILE_DEL_PEZZO"
          SBARRAMENTO_SOLO=suite SBARRAMENTO_USCITA=registri \
          SBARRAMENTO_PEZZO=${{ matrix.pezzo }} \
          bash tool/sbarramento.sh $FILE_DEL_PEZZO

      - name: Il registro del pezzo, per l'ultima macchina
        uses: actions/upload-artifact@v4
        with:
          name: registro-suite-${{ matrix.pezzo }}
          path: registri/
          if-no-files-found: error

  scala:
    name: il corredo a scala 1,3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      - name: Dipendenze Flutter
        run: flutter pub get

      - name: Il corredo a scala massima
        run: SBARRAMENTO_SOLO=scala SBARRAMENTO_USCITA=registri bash tool/sbarramento.sh

      - name: Il registro del corredo, per l'ultima macchina
        uses: actions/upload-artifact@v4
        with:
          name: registro-scala
          path: registri/
          if-no-files-found: error

  server_e_chiusure:
    name: il server e le chiusure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      # **NODE PER LA SECONDA SUITE**, quella del server, che gira con npm
      # dentro functions/.
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Dipendenze Flutter
        run: flutter pub get

      # **LE DIPENDENZE DEL SERVER, ordine CODEMAGIC1 voce 03.** Senza questa
      # riga `functions/node_modules` non esiste, e lo sbarramento dichiara di
      # non aver guardato la seconda suite: e' cio' che e' successo su
      # Codemagic in ogni build fino alla 2264.
      - name: Dipendenze del server
        working-directory: functions
        run: npm ci

      - name: Le prove del server
        run: SBARRAMENTO_SOLO=server SBARRAMENTO_USCITA=registri bash tool/sbarramento.sh

      - name: Le chiusure dichiarate
        run: SBARRAMENTO_SOLO=chiusure SBARRAMENTO_USCITA=registri bash tool/sbarramento.sh

      - name: I registri del server e delle chiusure, per l'ultima macchina
        uses: actions/upload-artifact@v4
        with:
          name: registro-server-e-chiusure
          path: registri/
          if-no-files-found: error

  verde:
    name: analyze e sbarramento
    needs: [analisi, pezzo, scala, server_e_chiusure]
    # Decide anche quando una macchina e' caduta: un registro che manca
    # ferma il cancello, e il motivo si legge qui.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: I registri di tutte le macchine
        uses: actions/download-artifact@v4
        with:
          pattern: registro-*
          merge-multiple: true
          path: registri

      # **LO SBARRAMENTO, deciso sui registri delle macchine.** Il registro si
      # tiene da parte perche' il passo dopo ne ripubblichi il verdetto:
      # `pipefail` serve o `tee` restituirebbe il suo zero al posto
      # dell'esito del cancello, e un cancello rosso passerebbe per verde.
      - name: Lo sbarramento, sui registri delle macchine
        run: |
          set -o pipefail
          SBARRAMENTO_DA_REGISTRI=registri SBARRAMENTO_PEZZI=6 bash tool/sbarramento.sh 2>&1 | tee /tmp/sbarramento.txt

      # **IL VERDETTO, DOVE SI LEGGE SENZA CREDENZIALI. Ordine CODEMAGIC1
      # voce 05.** I registri delle azioni non si leggono senza essere
      # autenticati, nemmeno su un repository pubblico: l'API risponde 403 e
      # la pagina dice "Sign in to view logs". Le annotazioni invece sono
      # pubbliche. Questo passo porta li' la riga per cui il cancello si e'
      # fermato, cosi' chi deve ripararla la trova senza chiedere a nessuno.
      - name: Il verdetto del cancello, leggibile senza credenziali
        if: failure()
        run: bash tool/il_verdetto_del_cancello.sh /tmp/sbarramento.txt
