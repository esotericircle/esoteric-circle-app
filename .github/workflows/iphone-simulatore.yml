# L'APP SUL SIMULATORE DI IPHONE, con le catture fra i risultati del giro.
# Ordine GA voce 12, 20 ottobre 2026.
#
# **Perche' esiste.** Il fondatore, 19 ottobre 2026: "deve verificare anche
# che difetti e regressioni siano risolte anche su iPhone perche' 80% dei
# tester usano iPhone". Il progetto si sviluppa su Windows, dove iOS non si
# compila, e l'unico Mac che costruisce e' quello di Codemagic, a minuti
# contati e solo per TestFlight. Il repository e' pubblico, quindi le
# macchine macOS di GitHub sono gratuite: qui si compila l'app per il
# simulatore, la si apre e si fotografa lo schermo.
#
# **Cosa fa.** Compila in debug per il simulatore (il simulatore non accetta
# le build di rilascio), accende un iPhone simulato, installa l'app, la apre
# e scatta una serie di catture a tempi fissi dall'avvio. Poi, se esiste la
# prova del percorso in tool/iphone_simulatore/, la fa girare e salva le
# catture delle schermate principali. Tutto finisce nell'artifact
# "iphone-simulatore-catture", insieme al registro dell'app e agli eventuali
# rapporti di crollo. Ogni cattura e' anche misurata (dimensioni e quota di
# schermo non nero) in un'annotazione pubblica, che si legge senza entrare.
#
# **Quando gira.** A mano (workflow_dispatch), oppure su una spinta sul ramo
# canonico il cui ultimo commit nomina "Ordine GA" o porta "[iphone]". Mai a
# ogni spinta: le altre spinte vedono il lavoro saltato in un secondo.
#
# **Cosa NON fa**, e va detto. Non firma, non archivia, non installa su
# nessun telefono e non va su TestFlight: quelle restano di Codemagic e del
# fondatore (ordine GA, R3). Non scrive nel repository: il permesso e' di
# sola lettura.
#
# **LE SPESE, regola del fondatore del 14 ottobre 2026.** L'app sul
# simulatore e' in debug, quindi App Check usa il fornitore di debug: senza
# un token registrato nella console di Firebase il server rifiuta le
# chiamate, e nessuna chiamata a Gemini puo' costare. Il token si passa SOLO
# a mano, scegliendo "con_server" all'avvio del giro, e solo se esiste il
# segreto APP_CHECK_DEBUG_TOKEN: e' la scelta del fondatore per quella
# occasione, mai un automatismo delle spinte.
#
# **I SEGRETI.** GoogleService-Info.plist non sta nel repository (e' escluso
# da .gitignore, il repository e' pubblico) ed e' citato dal progetto Xcode
# fra le risorse: senza, Xcode non compila. Arriva dal segreto del
# repository GOOGLE_SERVICE_INFO_PLIST, lo stesso contenuto della variabile
# omonima di Codemagic (testo del file o il suo base64). Se manca, il giro
# si ferma al secondo passo e dice nell'annotazione cosa deve fare il
# fondatore.
name: iPhone sul simulatore (catture)

on:
  workflow_dispatch:
    inputs:
      con_server:
        description: "Passa il token di debug di App Check (segreto APP_CHECK_DEBUG_TOKEN): le chiamate al server possono partire e costare"
        type: boolean
        default: false
  push:
    branches:
      - claude/esoteric-circle-master-order-e798aj

permissions:
  contents: read

concurrency:
  group: iphone-simulatore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulatore:
    name: compila, apre e fotografa
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Ordine GA') ||
      contains(github.event.head_commit.message, '[iphone]')
    # **LA MACCHINA INTEL, ordine GA voce 12, 21 ottobre 2026.** Era
    # un'ipotesi: che il collegamento cadesse su "Framework 'Pods_Runner' not
    # found" perche' i pod di ML Kit e MediaPipe non avessero la fetta per il
    # simulatore arm64. L'ipotesi e' caduta: sulla macchina Intel il giro
    # cade allo stesso modo (118968402031), e la causa vera e' il target
    # Pods-Runner che Xcode non costruisce (vedi il passo della
    # compilazione). La macchina Intel resta perche' col simulatore x86_64 i
    # pod di ML Kit non pongono dubbi di architettura.
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      BUNDLE_ID: com.esotericircle.esotericCircle
      CATTURE: ${{ github.workspace }}/catture_iphone
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: La configurazione di Firebase, dal segreto del repository
        shell: bash
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          mkdir -p "$CATTURE"
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            TESTO="Manca il segreto del repository GOOGLE_SERVICE_INFO_PLIST, e senza GoogleService-Info.plist Xcode non compila (il file e' fra le risorse del progetto). PASSO MANUALE DEL FONDATORE: 1) su GitHub apri esotericircle/esoteric-circle-app, Settings, Secrets and variables, Actions; 2) New repository secret, nome GOOGLE_SERVICE_INFO_PLIST; 3) come valore incolla lo stesso contenuto della variabile GOOGLE_SERVICE_INFO_PLIST di Codemagic (il testo del file GoogleService-Info.plist dell'app iOS, scaricato dalla console di Firebase, Impostazioni progetto, app iOS com.esotericircle.esotericCircle; va bene anche il suo base64); 4) Add secret, poi riavvia questo giro da Actions, iPhone sul simulatore, Run workflow."
            echo "::error title=Manca il segreto GOOGLE_SERVICE_INFO_PLIST::$TESTO"
            printf '## Il giro si e fermato: manca un segreto\n\n%s\n' "$TESTO" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Tollerante come il gemello di Codemagic: base64 o testo grezzo.
          if echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist 2>/dev/null \
             && head -c5 ios/Runner/GoogleService-Info.plist | grep -q '<'; then
            echo "GoogleService-Info.plist scritto da base64."
          else
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist scritto da testo grezzo."
          fi
          if ! grep -q "GOOGLE_APP_ID" ios/Runner/GoogleService-Info.plist; then
            echo "::error title=Il segreto GOOGLE_SERVICE_INFO_PLIST e' incompleto::il file scritto non contiene GOOGLE_APP_ID. Va incollato il GoogleService-Info.plist intero dell'app iOS."
            exit 1
          fi

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # LA VERSIONE E' FISSATA, ordine AH: il numero sovrano vive in
          # docs/versione_flutter.json e la prova
          # la_versione_di_flutter_e_una_sola pretende che coincida.
          flutter-version: 3.44.5
          cache: true

      # **L'XCODE PIU' RECENTE DELLA MACCHINA. Ordine GA voce 12, 20 ottobre
      # 2026.** Il primo giro col plist (39487970501) e' caduto con Xcode
      # 16.4: device_info_plus 13.2 chiama isiOSAppOnVision, che esiste solo
      # nell'SDK di iOS 26 (Xcode 26), quello con cui Codemagic costruisce
      # le build vere. Si sceglie l'Xcode piu' alto installato sull'immagine.
      - name: L'Xcode piu' recente
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app || true
          ultimo=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$ultimo" ]; then sudo xcode-select -s "$ultimo/Contents/Developer"; fi
          xcodebuild -version

      - name: Che macchina e', prima di costruire
        shell: bash
        run: |
          sw_vers || true
          xcodebuild -version || true
          flutter --version
          xcrun simctl list runtimes || true

      - name: Dipendenze
        shell: bash
        run: |
          flutter pub get
          flutter precache --ios

      - name: Compila per il simulatore
        shell: bash
        env:
          APP_CHECK_DEBUG_TOKEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.con_server) && secrets.APP_CHECK_DEBUG_TOKEN || '' }}
        run: |
          DEFINE=()
          if [ -n "$APP_CHECK_DEBUG_TOKEN" ]; then
            DEFINE=(--dart-define=APP_CHECK_DEBUG_TOKEN="$APP_CHECK_DEBUG_TOKEN")
            echo "Token di debug di App Check passato: le chiamate al server possono partire."
          else
            echo "Nessun token di debug di App Check: l'app parte, le chiamate al server vengono rifiutate."
          fi
          # Il registro intero (-v) va nell'artifact; a video e nelle
          # annotazioni restano le righe del collegamento e degli errori, che
          # senza -v Flutter riassume in una riga sola.
          # **IL FRAMEWORK OMBRELLO DEI POD PRIMA DELL'APP, 21 ottobre 2026.**
          # Il registro intero del giro 39522190741 lo dice: nel grafo delle
          # dipendenze il target Runner dipende dai singoli pod (via
          # OTHER_LDFLAGS) ma non dal target Pods-Runner, che quindi Xcode non
          # costruisce mai, e il collegamento cade su "framework 'Pods_Runner'
          # not found" (su Apple Silicon e su Intel allo stesso modo). Qui si
          # preparano i pod (--config-only fa pod install), si costruisce
          # Pods-Runner nella stessa cartella dei prodotti, poi l'app.
          flutter build ios --simulator --debug --config-only "${DEFINE[@]}"
          xcodebuild -project ios/Pods/Pods.xcodeproj -target Pods-Runner -configuration Debug -sdk iphonesimulator SYMROOT="$PWD/build/ios" build > "$CATTURE/registro_dei_pod.txt" 2>&1 || { tail -n 60 "$CATTURE/registro_dei_pod.txt"; echo "::error title=Pods-Runner non si costruisce::vedi registro_dei_pod.txt"; exit 1; }
          tail -n 5 "$CATTURE/registro_dei_pod.txt"
          ls -d build/ios/Debug-iphonesimulator/Pods_Runner.framework
          # Il filtro scrive su file e non in un tubo con head: con pipefail un
          # head che chiude presto faceva uscire il passo col codice 2 anche a
          # compilazione riuscita (giro 118947297363).
          set +e
          flutter build ios --simulator --debug -v "${DEFINE[@]}" > "$CATTURE/registro_della_compilazione_intero.txt" 2>&1
          ESITO=$?
          grep -nE "error:|\*\* BUILD|ld: |building for|ignoring file|Pods_Runner|Failed to build|Built build" "$CATTURE/registro_della_compilazione_intero.txt" > "$RUNNER_TEMP/filtrate.txt"
          grep -v "Fetching" "$RUNNER_TEMP/filtrate.txt" > "$RUNNER_TEMP/filtrate2.txt"
          sed -n '1,80p' "$RUNNER_TEMP/filtrate2.txt" > "$CATTURE/registro_della_compilazione.txt"
          set -e
          cat "$CATTURE/registro_della_compilazione.txt"
          echo "Esito della compilazione: $ESITO"
          tail -n 40 "$CATTURE/registro_della_compilazione_intero.txt"
          if [ "$ESITO" != "0" ]; then exit "$ESITO"; fi
          ls -la build/ios/iphonesimulator/

      - name: Accende un iPhone simulato
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/dispositivi.json"
          SCELTA="$(python3 - "$RUNNER_TEMP/dispositivi.json" <<'PY'
          import json, re, sys
          dati = json.load(open(sys.argv[1]))["devices"]
          def versione(chiave):
              m = re.search(r"iOS-(\d+)-(\d+)", chiave)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for chiave in sorted(dati, key=versione, reverse=True):
              if "iOS" not in chiave:
                  continue
              telefoni = [d for d in dati[chiave] if d["name"].startswith("iPhone") and d.get("isAvailable", True)]
              if not telefoni:
                  continue
              preferiti = [d for d in telefoni if "Pro" in d["name"] and "Max" not in d["name"]] or telefoni
              d = preferiti[0]
              print(d["udid"] + "|" + d["name"] + "|" + chiave.split(".")[-1])
              break
          PY
          )"
          if [ -z "$SCELTA" ]; then
            echo "::error title=Nessun iPhone simulato::la macchina non elenca nessun simulatore di iPhone disponibile."
            exit 1
          fi
          UDID="${SCELTA%%|*}"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Simulatore scelto: $SCELTA"
          echo "$SCELTA" > "$CATTURE/simulatore.txt"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl ui "$UDID" appearance dark || true

      - name: Installa, apre e fotografa a tempi fissi
        shell: bash
        run: |
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          # I permessi dati prima, cosi' nessuna finestra di sistema copre le
          # catture; la posizione e' Milano, per il cielo in tempo reale.
          xcrun simctl privacy "$UDID" grant all "$BUNDLE_ID" || true
          xcrun simctl location "$UDID" set 45.4642,9.1900 || true
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'process == "Runner"' > "$CATTURE/registro_dell_app.txt" 2>&1 &
          REGISTRO_PID=$!
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          INIZIO=$(date +%s)
          N=0
          for T in 3 8 15 25 40 60 90; do
            ATTESA=$(( INIZIO + T - $(date +%s) ))
            [ "$ATTESA" -gt 0 ] && sleep "$ATTESA"
            N=$((N + 1))
            NOME="$(printf 'avvio_%02d_dopo_%02ds.png' "$N" "$T")"
            xcrun simctl io "$UDID" screenshot "$CATTURE/$NOME"
          done
          # Si guarda il processo sul Mac, non launchctl del simulatore: sul
          # simulatore di iOS 26 launchctl non elenca l'app col suo bundle, e
          # il giro del 21 ottobre (118984243710) diceva "non e' piu' viva"
          # con l'app in primo piano nella cattura dei 90 secondi.
          if pgrep -f "CoreSimulator/Devices/$UDID/.*/Runner.app/Runner" > /dev/null; then
            echo "L'app e' ancora viva dopo 90 secondi." | tee "$CATTURE/esito_avvio.txt"
          else
            echo "::error title=L'app non e' piu' viva::dopo 90 secondi il processo di $BUNDLE_ID non c'e' piu'. Guarda registro_dell_app.txt e i rapporti di crollo nell'artifact."
            echo "L'app NON e' piu' viva dopo 90 secondi." > "$CATTURE/esito_avvio.txt"
          fi
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
          kill "$REGISTRO_PID" || true

      # IL PERCORSO NON DECIDE IL GIRO: la serie dell'avvio e' la prova
      # minima, il percorso e' in piu'. Se cade, il passo resta segnato
      # rosso, ripubblica la coda del suo registro in un'annotazione e il
      # giro va avanti fino all'artifact.
      - name: Il percorso delle schermate principali
        continue-on-error: true
        shell: bash
        run: |
          SORGENTI=tool/iphone_simulatore
          if ! ls "$SORGENTI"/*_test.dart.txt > /dev/null 2>&1; then
            echo "Nessuna prova del percorso in $SORGENTI: resta la sola serie dell'avvio."
            exit 0
          fi
          # integration_test NON sta nel pubspec del repository: l'ordine
          # del 6 ottobre 2026 l'ha tolto perche' rompe le build di rilascio.
          # Si aggiunge solo qui, sulla copia del giro, che nessuno spinge.
          # Con una descrizione il pacchetto va col prefisso dev: davanti, non
          # con --dev (flutter pub add, giro 118984243710: "cannot be combined").
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' 'dev:flutter_driver:{"sdk":"flutter"}'
          mkdir -p integration_test test_driver
          for f in "$SORGENTI"/*_test.dart.txt; do
            cp "$f" "integration_test/$(basename "${f%.txt}")"
          done
          cp "$SORGENTI/driver_delle_catture.dart.txt" test_driver/integration_test.dart
          xcrun simctl privacy "$UDID" grant all "$BUNDLE_ID" || true
          ESITO=0
          for prova in integration_test/*_test.dart; do
            flutter drive --driver=test_driver/integration_test.dart \
              --target="$prova" -d "$UDID" --debug \
              2>&1 | tee -a "$CATTURE/registro_del_percorso.txt" || ESITO=1
          done
          # La seconda strada delle catture: la cartella dei documenti
          # dell'app, sul disco del Mac.
          DATI="$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data 2>/dev/null || true)"
          if [ -n "$DATI" ] && [ -d "$DATI/Documents/catture_percorso" ]; then
            mkdir -p "$CATTURE/percorso_dal_telefono"
            cp "$DATI/Documents/catture_percorso/"*.png "$CATTURE/percorso_dal_telefono/" || true
          fi
          ls -laR "$CATTURE"
          if [ "$ESITO" -ne 0 ]; then
            grep -E "PERCORSO GA.12|error|Error|EXCEPTION|Failure" "$CATTURE/registro_del_percorso.txt" | tail -40 \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | cut -c1-7000 > "$RUNNER_TEMP/percorso.txt"
            echo "::error title=Il percorso delle schermate e' caduto::$(cat "$RUNNER_TEMP/percorso.txt")"
            exit 1
          fi
          grep "PERCORSO GA.12" "$CATTURE/registro_del_percorso.txt" \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk '{printf "%s%%0A", $0}' | cut -c1-7000 > "$RUNNER_TEMP/percorso.txt" || true
          echo "::notice title=Il percorso delle schermate::$(cat "$RUNNER_TEMP/percorso.txt")"

      - name: Rapporti di crollo, se ce ne sono
        if: always()
        shell: bash
        run: |
          mkdir -p "$CATTURE/crolli"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'Runner*' -newer "$CATTURE/simulatore.txt" \
            -exec cp {} "$CATTURE/crolli/" \; 2>/dev/null || true
          ls -la "$CATTURE/crolli"

      - name: Le catture misurate, in annotazioni pubbliche
        if: always()
        shell: bash
        run: |
          ls "$CATTURE"/*.png > /dev/null 2>&1 || { echo "::warning title=Nessuna cattura::il giro non ha prodotto catture."; exit 0; }
          python3 -m venv "$RUNNER_TEMP/misura"
          "$RUNNER_TEMP/misura/bin/pip" install -q pillow
          "$RUNNER_TEMP/misura/bin/python" - "$CATTURE" <<'PY'
          import glob, os, sys
          from PIL import Image
          righe = []
          for p in sorted(glob.glob(os.path.join(sys.argv[1], "*.png"))):
              im = Image.open(p).convert("RGB")
              w, h = im.size
              piccola = im.resize((w // 8, h // 8))
              px = list(piccola.getdata())
              accesi = sum(1 for r, g, b in px if r + g + b > 60)
              colori = len(set((r // 16, g // 16, b // 16) for r, g, b in px))
              righe.append("%s: %dx%d, schermo non nero %.1f%%, colori distinti %d" % (
                  os.path.basename(p), w, h, 100.0 * accesi / len(px), colori))
          testo = "%0A".join(righe)
          print("::notice title=Catture dell'iPhone simulato::" + testo)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Catture dell'iPhone simulato\n\n" + "\n".join("- " + r for r in righe) + "\n")
          PY

      - name: Il motivo della caduta, in annotazioni pubbliche
        if: failure()
        shell: bash
        run: |
          # I registri delle azioni non si leggono senza entrare, nemmeno su
          # un repository pubblico; le annotazioni si'. Qui si ripubblicano
          # le righe d'errore e la coda dei registri del giro.
          annota() {
            local titolo="$1" file="$2"
            [ -s "$file" ] || return 0
            local testo
            testo="$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' "$file" | awk '{printf "%s%%0A", $0}' | cut -c1-7000)"
            echo "::error title=$titolo::$testo"
          }
          for registro in registro_della_compilazione registro_del_percorso; do
            f="$CATTURE/$registro.txt"
            [ -f "$f" ] || continue
            grep -nE "error:|Error:|ERROR|Failed|FAILED|Exception|fatal" "$f" | grep -v "^.*warning:" | head -40 > "$RUNNER_TEMP/errori.txt" || true
            tail -60 "$f" > "$RUNNER_TEMP/coda.txt"
            annota "Righe d'errore di $registro" "$RUNNER_TEMP/errori.txt"
            annota "Coda di $registro" "$RUNNER_TEMP/coda.txt"
          done

      - name: Pubblica le catture come artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-simulatore-catture
          path: catture_iphone/
          if-no-files-found: warn
          retention-days: 30
