name: esoteric_circle
description: "Esoteric Circle, ecosistema esoterico immersivo. App nativa Flutter."
publish_to: "none"

# La versione segue il formato semver+build.
# Il numero dopo il piu' e' il versionCode di Android, che deve crescere
# sempre: una build con numero piu' basso non si installa sopra una piu'
# alta. Le release costruite con --split-per-abi arrivavano a 2001, perche'
# lo split somma duemila per l'ABI arm64, quindi si riparte da sopra quella
# soglia. Il lucchetto e' test/versione_build_test.dart, che confronta il
# numero con docs/versione_distribuita.json.
version: 0.1.0+2316

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # I DELEGATI DI SISTEMA, ordine DM voce 02, 16 settembre 2026.
  #
  # **Il difetto che curano, e c'era in italiano**: senza questi delegati i
  # widget che Flutter disegna da se' parlano inglese. Si vede in tre punti,
  # misurati: i due selettori di data del profilo e del Sigillo, e il
  # selettore dell'ora delle notifiche. Una persona che sceglie la sua data di
  # nascita leggeva CANCEL e OK.
  #
  # **Il rischio guardato prima di scrivere questa riga.** Le versioni
  # Firebase qui sotto sono fissate senza caret perche' le patch successive
  # non compilano. Prima di toccare il pubspec ho girato la risoluzione a
  # secco, e il piano diceva una riga sola: "+ intl 0.20.3, Would change 1
  # dependency". Nessun pacchetto firebase si muove.
  flutter_localizations:
    sdk: flutter
  # La formattazione di numeri e date che segue la lingua: la virgola
  # decimale in italiano, il punto in inglese. Ordine DM voce 03.
  # **NON 0.20.3, e il perche' vale piu' del numero.** La risoluzione a secco
  # del solo `intl`, senza i delegati, proponeva 0.20.3. Con
  # `flutter_localizations` no: quel pacchetto viene dall'SDK di Flutter e
  # porta il proprio vincolo su `intl`, e con 0.20.3 fisso la risoluzione
  # fallisce. **Il piano a secco di una dipendenza sola non e' il piano di
  # due**, ed e' una cosa che si scopre solo provando.
  intl: ^0.20.2

  # Icone di sistema iOS oltre a quelle Material.
  cupertino_icons: ^1.0.8

  # Gestione dello stato leggera e matura, usata per Maestro attivo,
  # feature flag ed entitlement. Nessuna dipendenza pesante.
  provider: ^6.1.2

  # Sensori del device (giroscopio) per la parallasse. Con fallback: se il
  # sensore manca o non e' disponibile, la parallasse resta guidata dallo
  # scorrimento e da un moto lento, senza mai bloccare l'esperienza.
  sensors_plus: ^6.1.1

  # --- Firebase, lo strato che fa girare l'app (C3 passo 1) ---
  # L'AI a runtime e' Gemini su Vertex, e passa tutta da qui: nessun altro
  # fornitore, nessuna chiave nel client, nessun segreto su Git.
  #
  # Versioni fissate di proposito, senza caret. I rilasci successivi di questi
  # plugin (per esempio firebase_auth 6.5.5, cloud_firestore 6.7.0, firebase_ai
  # 3.14.0, firebase_app_check 0.4.5+1, firebase_core 4.12.0) estendono
  # `FirebasePlugin`, una classe non presente in firebase_core_platform_interface
  # 7.1.0 (l'ultima risolta), percio' con quelle patch l'app non compila. Questo
  # set e' l'ultimo compatibile con il platform interface 7.x. Da rialzare tutte
  # insieme quando il platform interface tornera' allineato.
  firebase_core: 4.11.0

  # Firebase AI Logic: chat dei Maestri su Gemini via backend Vertex, protetta
  # da App Check. E' la sola via all'LLM a runtime.
  firebase_ai: 3.13.1
  # Il client HTTP che mette l'etichetta della funzione su ogni chiamata al
  # modello (ordine EW voce EW.03, `l_etichetta_della_funzione.dart`). Era
  # gia' nell'albero come dipendenza di firebase_ai, alla stessa versione.
  http: ^1.6.0

  # L'impronta SHA-256 di ogni file dei mazzi scaricati dal bucket (ordine FJ
  # voce 12, `i_mazzi_scaricati.dart`): un file che non torna si riscarica.
  # Era gia' nell'albero, fra le dipendenze delle prove, alla stessa versione.
  crypto: ^3.0.7

  # App Check: protegge le chiamate all'AI Logic dagli abusi.
  firebase_app_check: 0.4.5

  # Crashlytics: gli occhi sui crash, dal 7 agosto 2026. La 2157 iOS moriva
  # MUTA sull'iPhone di Mauro all'ingresso del trionfo dell'Animale Guida, e
  # senza rapporti si sarebbe corretto alla cieca. 5.2.4 e' MISURATA, non
  # stimata: pubblicata lo stesso giorno di firebase_core 4.11.0 e ultima a
  # chiedere ^4.11.0, dalla 5.2.5 serve un core piu' nuovo che questo set
  # inchiodato non puo' dare. Si rialza insieme a tutto il set, come dice il
  # commento del set.
  firebase_crashlytics: 5.2.4

  # Auth anonima: un uid stabile su cui appendere la memoria dell'utente.
  firebase_auth: 6.5.4
  google_sign_in: ^6.3.0

  # Firestore: memoria persistente per la Demo (profilo, fatti, sintesi di
  # sessione). L'evoluzione verso Cloud SQL con pgvector resta dietro la stessa
  # astrazione del repository di memoria.
  cloud_firestore: 6.6.0

  # Cloud Functions: la carta natale passa dalla callable "natalChart" in
  # europe-west1, che tiene la chiave FreeAstroAPI in Secret Manager (mai nel
  # client) ed e' protetta da App Check. Versione fissata come gli altri plugin
  # Firebase per restare sul platform interface 7.x.
  cloud_functions: 6.3.3

  # Preferenze locali del dispositivo: qui tiene stabile il token di debug di
  # App Check, cosi' resta lo stesso fra un avvio e l'altro.
  shared_preferences: ^2.5.5
  share_plus: ^13.2.0
  path_provider: ^2.1.6
  geolocator: ^14.0.3

  # IL NOME DEL LUOGO, non le sue coordinate. Ordine 2168, voce 4: la scheda
  # del cielo dice da dove il cielo e' calcolato, e le coordinate da sole non
  # dicono niente a chi legge. La geocodifica inversa passa dai servizi del
  # sistema operativo, quindi dalla rete: vive dietro `SkyLocation`, in un
  # punto solo, e nelle prove e nelle anteprime non viene mai chiamata.
  geocoding: ^4.0.0

  # Microfono: coglie il soffio nel Soffio del Destino leggendo il livello
  # audio. Con ripiego tattile se il permesso manca o il device non ha il
  # microfono. Nessuna registrazione salvata, solo l'ampiezza in tempo reale.
  # L'UNICO motore di riproduzione dell'app. Serve tre usi con una dipendenza
  # sola: gli effetti brevi della palette, le frequenze e il battito theta
  # della Meditazione e del Rito del Sogno, e domani la voce dei Maestri.
  # Prima non esisteva alcuna dipendenza di riproduzione: c'era solo record,
  # che registra, quindi l'app era muta per costruzione.
  audioplayers: ^6.1.0

  record: 5.2.1

  # **LA DETTATURA DEL MESSAGGIO. Ordine CI voce 05.**
  #
  # Il riconoscimento e' quello della PIATTAFORMA: su iOS il framework Speech,
  # su Android il riconoscitore di sistema. Costo zero, nessun servizio a
  # pagamento, e **nessun audio parte verso il nostro server**, che e' il
  # vincolo dell'ordine.
  #
  # Il permesso del microfono c'era gia' per il Soffio del Destino, e la
  # richiesta passa dalla porta di casa, PortaDelPermesso, che sa distinguere
  # un no dalla piattaforma che il sensore non ce l'ha.
  speech_to_text: ^7.0.0
  image_picker: ^1.2.3

  # Costellazione del Viso: anteprima della fotocamera frontale e rilevamento
  # del volto on-device coi contorni (ML Kit). Nessuna immagine lascia il
  # dispositivo, nessuna foto salvata oltre l'uso locale. Con ripiego tattile
  # quando manca la fotocamera o il permesso.
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.1
  mediapipe_face_mesh: ^2.9.0
  video_player: ^2.13.0
  # **FFMPEG, ordine FZ voce 08, 17 ottobre 2026**: scrive il titolo e la
  # data sopra il video della rivelazione, per condividerlo come storia.
  # Il fondatore ha scelto questa via sapendo il costo (qualche decina di
  # MB in piu' sul pacchetto, una dipendenza nativa in piu'): vedi il
  # rapporto dell'ordine per la nota sulla licenza GPL del codificatore
  # x264, che serve per scrivere di nuovo un MP4 H.264 dopo il testo.
  # min_gpl e' la piu' piccola delle varianti che porta x264.
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.3
  # **IL CANALE DELLE PUSH. Ordine CG voce 16.**
  #
  # Parole del fondatore, 31 agosto 2026: "devi aggiungere le notifiche push
  # legate a ogni dono del giorno... adesso le voglio". Il fatto che l'ha
  # aperta, del 30 agosto: "da quando ho iniziato a installare le varie build
  # dell'APP NON HO MAI RICEVUTO ALCUNA NOTIFICA PUSH PER I DONI, MAI!", e la
  # ragione era che il canale non esisteva.
  #
  # **Le chiamate locali restano**, accese e gratuite per tutti: le push si
  # aggiungono, non sostituiscono.
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

  # **IL SIGILLO NELLE FOTO, SU IPHONE. Ordine DO voce 07.**
  #
  # iOS non ha nessuna API per impostare lo sfondo, e non c'e' scappatoia:
  # il Sigillo si salva nelle foto e la persona lo mette come sfondo dalle
  # impostazioni. gal scrive nella libreria col solo permesso di aggiunta,
  # NSPhotoLibraryAddUsageDescription. Su Android lo sfondo lo imposta
  # WallpaperManager dal canale di MainActivity, e gal li' non si chiama.
  gal: ^2.3.3
  app_links: ^7.2.1
  livekit_client: ^2.13.0
  pdf: ^3.13.1
  qr_flutter: ^4.1.0
  google_mlkit_barcode_scanning: ^0.14.2
  flutter_contacts: ^2.6.0
  url_launcher: ^6.3.3

# Un solo blocco, per un guasto a monte che ferma la build Android.
#
# record 5.2.1 vincola record_linux a '>=0.5.0 <1.0.0' e lascia libero
# record_platform_interface a ^1.2.0, quindi la risoluzione mette insieme
# record_linux 0.7.2 e un'interfaccia 1.5 o superiore, che ha startStream e
# hasPermission con un argomento denominato in piu'. La 0.7.2 non li
# implementa. Il registrant dei plugin generato da Flutter importa i pacchetti
# di TUTTE le piattaforme, Linux compreso, quindi quel codice si compila anche
# quando il bersaglio e' Android e la build cade sul kernel snapshot. Si sale
# quindi a record_linux 1.3.1, che chiede ^1.5.0 e l'interfaccia la implementa.
# Nessun effetto sul comportamento su Android e iOS, dove l'implementazione in
# uso e' record_android o record_darwin. Da togliere quando record salira' a
# una versione le cui implementazioni sono di nuovo allineate fra loro.
dependency_overrides:
  record_linux: 1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter ufficiale Flutter.
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^4.1.1
  # L'app Firebase finta dei banchi del costo (ordine EW voce EW.04): fa
  # girare sul PC le chiamate vere dell'app a Gemini. Era gia' nell'albero,
  # alla stessa versione.
  firebase_core_platform_interface: 7.1.0

  # Lettura di pubspec.yaml nei test di coerenza dello stato asset.
  yaml: ^3.1.2

  # LA PIATTAFORMA VIDEO SOSTITUIBILE NELLE PROVE.
  #
  # Senza, in prova headless il lettore non parte, l'intro finisce da sola per
  # la via d'errore, e OGNI prova sull'intro passerebbe anche se il tocco che
  # salta e Riduci Movimento non funzionassero: verde su niente. Con questa
  # dipendenza la prova mette al posto della piattaforma una finta che dichiara
  # il video pronto, e da li' in poi misura il comportamento vero. E' la stessa
  # via che il pacchetto usa per provare se stesso.
  video_player_platform_interface: ^6.9.0

  share_plus_platform_interface: any
flutter:
  uses-material-design: true

  # **IL VOLTO DEL LIVE SENZA IL FONDO BIANCO**, ordine EG voce 05: toglie il
  # fondo e il filo chiaro lungo la sagoma del video di Protoface.
  shaders:
    - shaders/volto_senza_fondo.frag

  # Asset consumati a runtime.
  assets:
    # I cinque suoni del Cerchio. La cartella e' dichiarata anche se vuota:
    # cosi' appena i file arrivano suonano senza toccare una riga di codice.
    - assets/audio/
    # **I DODICI VERSI, ordine DE voce 07.** Le cartelle degli asset NON sono
    # ricorsive: senza questa riga i file dentro assets/audio/animali non
    # entrerebbero nel pacchetto, e la rivelazione resterebbe muta anche il
    # giorno in cui i file ci sono. Dichiarata anche da vuota, come sopra.
    - assets/audio/animali/
    # Ordine FL voce 08: lo sfondo del tavolo e Medora tagliata alla vita.
    - assets/img/tavolo/
    # **IL TAMBURO DELLA DISCESA, ordine DJ voce 10**: tamburo_discesa.mp3,
    # in ciclo per tutta la discesa del Viaggio. Dichiarata anche da vuota,
    # come le due sopra: finche' il file manca la discesa resta muta.
    - assets/audio/mondo_di_sotto/
    # I QUATTRO ANELLI D'AMBIENTE, ordine CN del 1 settembre 2026. Stanno in
    # una cartella loro e non con gli effetti, perche' pesano due ordini di
    # grandezza di piu': un budget solo li nasconderebbe tutti e due.
    - assets/music/
    # LE TRE TRANSIZIONI DI STELLE, ordine AT voce 02: un WebP animato con
    # alpha per Maestro, due secondi esatti.
    - assets/
    - assets/data/
    # **LE REGOLE DEL NOME NEL CERCHIO, ordine EY voce 01**: un dato solo per
    # il server e per il telefono. Sta dove lo legge il server, e il telefono
    # lo porta da li', cosi' non esiste una seconda copia che diverge.
    - functions/src/il_nome_del_cerchio.json
    - assets/fonts/
    - assets/ritual_backgrounds/
    # Gli sfondi delle schede delle arti, tre formati per arte (ordine EO voce 01):
    # Vert 800x1000, Square 800x800, Oriz 1280x720; piu' i tre sfondi dei Maestri.
    - assets/schede/
    # L'EMBLEMA DELL'ANNO PER IL PDF, ordine ES voce 04: la copia in JPEG
    # dell'emblema della card, che il PDF incorpora senza decodificarla.
    - assets/pdf/
    # I tre avatar viaggiano in WebP: in PNG pesavano 16,6 MB, piu' di
    # tutti i 146 Angeli messi insieme. Gli originali restano in
    # brand_assets/ e non entrano piu' nel pacchetto.
    - assets/avatars_webp/
    - brand_assets/santuario/
    # L'INTRO, provvisoria per le dimostrazioni. Il video sta gia' nel repo e
    # non era dichiarato, quindi non entrava nel pacchetto.
    - brand_assets/intro/
    # I TRE VIDEO DI RIVELAZIONE DEI MAESTRI, ordine BQ. La cartella e'
    # dichiarata ANCHE DA VUOTA, come assets/audio/: cosi' i tre filmati si
    # vedono il giorno che arrivano, senza toccare una riga di codice. Sono
    # provvisori: un test, due su tre col watermark e da ingrandire, tutti e
    # tre da ottimizzare. Vedi brand_assets/maestri/LEGGIMI.md.
    - brand_assets/maestri/
    # LE TRE ARTI DEI SENTIERI, ordine T. I cinquantacinque elementi di ogni
    # Journal sono disegnati SPENTI dentro l'immagine: il codice ci mette
    # sopra le luci, e sa dove metterle perche' gli ancoraggi si ricavano da
    # qui con tool/ancoraggi_dai_sentieri.dart.
    - brand_assets/sentieri/
    # LA DISCESA NEL MONDO DI SOTTO, ordine DI voce 09. Un filmato solo,
    # 720 per 1280, 24 fotogrammi al secondo, 8 secondi, muto: il tamburo
    # e' un livello audio a parte. Come brand_assets/maestri/ la cartella
    # e' dichiarata anche da vuota, e i filmati stanno sotto brand_assets
    # e mai sotto assets. Impronta SHA-256 del file consegnato dal
    # fondatore: 0db19531145d83422858fdf342973533857a8bc3dc1f34a6d95aaf8eca12c77d.
    - brand_assets/mondo_di_sotto/
    # IL VIDEO DELLA SCENA DELLA STESA, ordine FS aggiunta voce FS.A1, 14
    # ottobre 2026: Medora che porta avanti il mazzo chiuso e le carte che
    # salgono in vortice e diventano polvere di stelle. Il file consegnato
    # dal fondatore era medora_mazzo_in_vortice_v1.mp4, 720 per 1280, 24
    # fotogrammi al secondo, 8 secondi, con l'audio, impronta SHA-256
    # e8b6d318cf3604bf3d58960edd2d8ea8bc056b8c6719216ce2862875b546b30b.
    # Dopo la build 2310 la fine e' rifatta: medora_mazzo_in_vortice_v2.mp4,
    # che si ferma con la mano sul petto rallentando in modo uniforme, 190
    # fotogrammi, impronta SHA-256
    # e0c3eb2acf150410805718995cfa33ec4388229cf5e636be8fa11ddaf1940c56.
    # Le due pose ferme stanno in assets/img/tavolo/.
    - brand_assets/tavolo/
    # LA SINASTRIA EVOLUTIVA, ordine FT voce FT.01, 14 ottobre 2026: lo
    # sfondo dello studio di Medora, le due pose ferme (astrolabio e mani
    # aperte, scontornate da tool/scontorna_le_pose_della_sinastria.py), le
    # dieci immagini coppia_<segno>_v1, i cinque capitolo_<nome>_v1, i cinque
    # aspetto_<nome>_v1 e i quattro legame_<nome>_v1.
    - assets/img/sinastria/
    # IL VIDEO DELLA SCENA DELLA SINASTRIA, ordine FT voce FT.02: Medora che
    # scioglie l'astrolabio in polvere d'oro. Il file consegnato dal
    # fondatore e' medora_astrolabio_in_polvere_v1.mp4, 720 per 1280, 24
    # fotogrammi al secondo, 8 secondi, 192 fotogrammi, impronta SHA-256
    # c93754b860aa147254f3c07a41e2c1a6984dd291740af8c192d52c692f491499.
    # Le due pose ferme stanno in assets/img/sinastria/.
    - brand_assets/sinastria/
    # L'ORACOLO DEGLI ANGELI, ordine FU voce FU.01, 15 ottobre 2026: la scala
    # accesa e spenta, le due pose di Medora, il primo e l'ultimo fotogramma
    # del video e i tre medaglioni dei ruoli (Custode, Cuore, Intelletto),
    # convertiti in WebP da tool/gli_asset_dell_ordine_fu.py.
    - assets/img/oracolo_angeli/
    # IL VIDEO DELLA SCALA DI GIACOBBE, voce FU.02, rifatto per l'ordine GC
    # (GC Aggiunta, il tavolo che resta vuoto): medora_scala_di_luce_v2.mp4,
    # 720 per 1280, 10 secondi, ricompresso in H.264 a qualita' costante 26
    # con l'audio (voce FU.12) da tool/gli_asset_dell_ordine_gc.py, impronta
    # SHA-256 99ec7f2a99ff9e924fee1c91d88f6ad5cdb101fadb8443f2f0428b57475fb6c1.
    - brand_assets/oracolo_angeli/
    # I SIMBOLI DIPINTI DEL LIVELLO VISIVO DEI RESPONSI, ordine GC voci GC.06
    # e GC.18, 22 ottobre 2026: i quattro semi dei Tarocchi, il segno degli
    # Arcani Maggiori e i nove segni dei cori angelici, 512 per 512 con la
    # trasparenza, convertiti in WebP da tool/gli_asset_dell_ordine_gc.py.
    - assets/img/simboli/
    # LA SCENA DELL'OROSCOPO, voce FU.13: la ruota accesa e spenta, le due
    # pose di Medora, il primo e l'ultimo fotogramma.
    - assets/img/oroscopo_scena/
    # medora_ruota_dello_zodiaco_v1.mp4, 1080 per 1920, 8 secondi, impronta
    # SHA-256 12e89d997afc2e04afb744cad535dd2c9f8ec010fd1c83f2fa4273443653089b.
    - brand_assets/oroscopo_scena/
    # LA SCENA DELLA SINASTRIA VIP, voce FU.14: il sipario chiuso, il palco
    # aperto, Medora padrona di casa, il primo e l'ultimo fotogramma.
    - assets/img/vip_scena/
    # medora_sipario_delle_stelle_v1.mp4, 1080 per 1920, 8 secondi, impronta
    # SHA-256 1cb114680e930d2323233333947acc762f6687ef4f8786ab1b90da8e97b02c2b.
    - brand_assets/vip_scena/
    # IL CALENDARIO LUNARE PERSONALE, ordine FV voce FV.01, 15 ottobre 2026:
