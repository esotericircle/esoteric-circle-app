name: esoteric_circle
description: "Esoteric Circle, ecosistema esoterico immersivo. App nativa Flutter."
publish_to: "none"

# La versione segue il formato semver+build.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icone di sistema iOS oltre a quelle Material.
  cupertino_icons: ^1.0.8

  # Gestione dello stato leggera e matura, usata per Maestro attivo,
  # feature flag ed entitlement. Nessuna dipendenza pesante.
  provider: ^6.1.2

  # Sensori del device (giroscopio) per la parallasse. Con fallback: se il
  # sensore manca o non e' disponibile, la parallasse resta guidata dallo
  # scorrimento e da un moto lento, senza mai bloccare l'esperienza.
  sensors_plus: ^6.1.1

  # --- Firebase, lo strato che fa girare l'app (C3 passo 1) ---
  # Claude costruisce, Gemini fa girare: l'AI a runtime passa da qui, mai dalle
  # API Anthropic. Nessuna chiave nel client, nessun segreto su Git.
  #
  # Versioni fissate di proposito, senza caret. I rilasci successivi di questi
  # plugin (per esempio firebase_auth 6.5.5, cloud_firestore 6.7.0, firebase_ai
  # 3.14.0, firebase_app_check 0.4.5+1, firebase_core 4.12.0) estendono
  # `FirebasePlugin`, una classe non presente in firebase_core_platform_interface
  # 7.1.0 (l'ultima risolta), percio' con quelle patch l'app non compila. Questo
  # set e' l'ultimo compatibile con il platform interface 7.x. Da rialzare tutte
  # insieme quando il platform interface tornera' allineato.
  firebase_core: 4.11.0

  # Firebase AI Logic: chat dei Maestri su Gemini via backend Vertex, protetta
  # da App Check. E' la sola via all'LLM a runtime.
  firebase_ai: 3.13.1

  # App Check: protegge le chiamate all'AI Logic dagli abusi.
  firebase_app_check: 0.4.5

  # Auth anonima: un uid stabile su cui appendere la memoria dell'utente.
  firebase_auth: 6.5.4

  # Firestore: memoria persistente per la Demo (profilo, fatti, sintesi di
  # sessione). L'evoluzione verso Cloud SQL con pgvector resta dietro la stessa
  # astrazione del repository di memoria.
  cloud_firestore: 6.6.0

  # Cloud Functions: la carta natale passa dalla callable "natalChart" in
  # europe-west1, che tiene la chiave FreeAstroAPI in Secret Manager (mai nel
  # client) ed e' protetta da App Check. Versione fissata come gli altri plugin
  # Firebase per restare sul platform interface 7.x.
  cloud_functions: 6.3.3

  # Preferenze locali del dispositivo: qui tiene stabile il token di debug di
  # App Check, cosi' resta lo stesso fra un avvio e l'altro.
  shared_preferences: ^2.5.5
  share_plus: ^13.2.0
  path_provider: ^2.1.6
  geolocator: ^14.0.3

  # Microfono: coglie il soffio nel Soffio del Destino leggendo il livello
  # audio. Con ripiego tattile se il permesso manca o il device non ha il
  # microfono. Nessuna registrazione salvata, solo l'ampiezza in tempo reale.
  record: 5.2.1
  image_picker: ^1.2.3

  # Costellazione del Viso: anteprima della fotocamera frontale e rilevamento
  # del volto on-device coi contorni (ML Kit). Nessuna immagine lascia il
  # dispositivo, nessuna foto salvata oltre l'uso locale. Con ripiego tattile
  # quando manca la fotocamera o il permesso.
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter ufficiale Flutter.
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^4.1.1

  # Lettura di pubspec.yaml nei test di coerenza dello stato asset.
  yaml: ^3.1.2

flutter:
  uses-material-design: true

  # Asset consumati a runtime.
  assets:
    - assets/
    - assets/data/
    - assets/fonts/
    - assets/ritual_backgrounds/
    - brand_assets/avatars/
    - brand_assets/santuario/
    # Le sei famiglie esoteriche in WebP a due misure: piena (a fuoco o
    # ingrandita) e miniatura (viste con piu' carte). Bundlate in-app per la
    # Demo, niente streaming. I conteggi sono sotto il lucchetto della CI in
    # docs/stato_asset.json, verificati da test/stato_asset_test.dart.
    - assets/img/mazzo-tarocchi/
    - assets/img/angeli/
    - assets/img/ritratti-vip/
    - assets/img/rune_bone/
    - assets/img/animali/
    - assets/img/cristalli/
    - assets/img/archetipi/
    - assets/img_thumb/mazzo-tarocchi/
    - assets/img_thumb/angeli/
    - assets/img_thumb/ritratti-vip/
    - assets/img_thumb/rune_bone/
    - assets/img_thumb/animali/
    - assets/img_thumb/cristalli/
    - assets/img_thumb/archetipi/
    # Zodiaco brandizzato, due asset distinti per segno: l'emblema 3D metallico
    # in assets/img/zodiac/ (testa della schermata) e il simbolo in miniatura in
    # assets/img_thumb/zodiac/ (chip del selettore). Ventiquattro file, tutti
    # presenti: nessun ripiego dipinto.
    - assets/img/zodiac/
    - assets/img_thumb/zodiac/

  # Tipografia del design system, inclusa nel bundle come asset locale, cosi'
  # il testo si legge sempre, anche offline e nell'anteprima headless. Sono
  # font variabili: i pesi si applicano a runtime via FontVariation.
  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-variable.ttf
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-variable.ttf
