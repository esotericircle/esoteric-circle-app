    # lib/core/legal/fonti_dei_dati.dart.
    - assets/img/calendario_lunare/lune/
    # IL VIDEO DELL'ALMANACCO DI LUCE, voce FV.02:
    # medora_almanacco_di_luce_v1.mp4, 1080 per 1920, 8 secondi, ricompresso
    # in H.264 a qualita' costante 26 con l'audio (metodo della voce FU.12),
    # impronta SHA-256
    # 585ac4b3d93495ce30ad7ac5ca69d83937b4e6388d018594d81a0bebd6493450.
    - brand_assets/calendario_lunare/
    # I VIDEO DI SCENA DEI TRE MAESTRI, ordine FW voce FW.01, 15 ottobre
    # 2026: il primo e l'ultimo fotogramma del dominio e della chat di
