    - assets/img/maestri_scena/
    # I sei video, H.264 a qualita' costante 26 con l'audio (metodo della
    # voce FU.12), da 54,9 a 23,7 MB in tutto. Le impronte SHA-256 stanno in
    # docs/collaudo/FW/fw01_asset.txt.
    - brand_assets/maestri_scena/
    # LA SCENA DEL RESPIRO DELLA LUNA, ordine FX, 16 ottobre 2026: i cinque
    # fotogrammi fermi (il respiro, il cielo senza luna, la consegna della
    # collana), convertiti in WebP da tool/gli_asset_dell_ordine_fx.py.
    - assets/img/respiro_della_luna/
